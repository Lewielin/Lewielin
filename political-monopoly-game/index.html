<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政治大富翁｜選戰風雲</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 開場 / 角色選擇畫面 -->
<section id="start-screen" class="screen">
  <h1>🗳️ 政治大富翁：選戰風雲</h1>
  <p class="subtitle">選出 2～4 位參選人，經營政績、募集政治獻金，最終在「選舉日」前累積最高民調，成功當選總統！</p>

  <div id="character-list" class="character-list"></div>

  <div class="rules-box">
    <h3>📜 快速上手（10 分鐘教學）</h3>
    <ol>
      <li>輪流擲骰子前進，經過「起點」可領取拉票金。</li>
      <li>走到「政策地產」可買下，別人踩到要付租金；同一色塊全收購可收雙倍租金。</li>
      <li>「機會卡」「命運卡」會觸發隨機政治事件，有好有壞。</li>
      <li>踩到「抹黑攻擊」會被送去「接受調查」，暫停一回合。</li>
      <li>資金歸零即宣告退選；撐到「選舉日」（第 15 輪結束）時，總資產最高者當選總統！</li>
    </ol>
  </div>

  <button id="start-btn" class="btn primary" disabled>開始遊戲</button>
</section>

<!-- 遊戲畫面 -->
<section id="game-screen" class="screen hidden">
  <header class="game-header">
    <h2>🗳️ 政治大富翁：選戰風雲</h2>
    <div id="round-info">第 1 / 15 輪</div>
  </header>

  <div class="game-layout">
    <div id="board" class="board"></div>

    <aside class="side-panel">
      <div id="current-player-banner" class="current-player-banner"></div>

      <div class="controls">
        <button id="roll-btn" class="btn primary">🎲 擲骰子</button>
        <div id="dice-result" class="dice-result"></div>
      </div>

      <div id="players-panel" class="players-panel"></div>

      <div id="log-panel" class="log-panel"></div>
    </aside>
  </div>
</section>

<!-- 購買地產 Modal -->
<div id="buy-modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="buy-title"></h3>
    <p id="buy-desc"></p>
    <div class="modal-actions">
      <button id="buy-confirm" class="btn primary">買下</button>
      <button id="buy-skip" class="btn">放棄</button>
    </div>
  </div>
</div>

<!-- 事件卡 Modal -->
<div id="event-modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="event-title"></h3>
    <p id="event-desc"></p>
    <div class="modal-actions">
      <button id="event-confirm" class="btn primary">確定</button>
    </div>
  </div>
</div>

<!-- 結局 Modal -->
<div id="end-modal" class="modal hidden">
  <div class="modal-box end-box">
    <h3 id="end-title">🎉 選舉結果公布</h3>
    <div id="end-results"></div>
    <button id="restart-btn" class="btn primary">再玩一次</button>
  </div>
</div>

<script src="characters.js"></script>
<script src="game.js"></script>
</body>
</html>
